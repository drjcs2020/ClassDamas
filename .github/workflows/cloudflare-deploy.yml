name: Publicar ClassDamas no Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-cloudflare:
    # DESATIVADO por padrão. Ativar após criar D1, configurar Secrets e variável.
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências no runner
        run: npm install --no-audit --no-fund
      - name: Gerar pacote seguro de assets
        run: npm run cf:build
      - name: Configurar ID D1 no runner sem gravar no Git
        run: node scripts/set-cloudflare-database.mjs
      - name: Aplicar somente migrações da base classdamas-db
        run: npx wrangler d1 migrations apply classdamas-db --remote
      - name: Publicar Worker e assets
        run: npx wrangler deploy
