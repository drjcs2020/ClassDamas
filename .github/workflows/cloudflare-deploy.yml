name: Publicar ClassDamas no Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-cloudflare:
    # Manual: permite o primeiro deploy com apenas dois Secrets.
    # Push na main: só publica quando a variável de liberação está true.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar credenciais sem expor os valores
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure os Secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Instalar dependências no runner
        run: npm install --no-audit --no-fund
      - name: Gerar pacote seguro de assets
        run: npm run cf:build
      - name: Criar ou localizar banco D1 exclusivo (sem tocar no Torneio V2)
        run: node scripts/prepare-cloudflare-database.mjs
      - name: Conferir UUID e nome do banco D1 antes das migrações
        run: node scripts/check-cloudflare-database.mjs
      - name: Aplicar somente migrações da base classdamas-db
        run: npx wrangler d1 migrations apply classdamas-db --remote
      - name: Publicar Worker e assets
        run: npx wrangler deploy
