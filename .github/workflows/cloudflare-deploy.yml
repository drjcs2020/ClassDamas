name: Publicar ClassDamas no Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'online.html'
      - 'online-app.js'
      - 'online-config.js'
      - 'online.css'
      - 'online-v3.css'
      - 'online-clean.css'
      - 'online-approved.css'
      - 'index.html'
      - 'assets/**'
      - 'bot-ai.js'
      - 'regras.js'
      - 'regras-classico.js'
      - 'cloudflare/**'
      - 'duel-api/**'
      - 'scripts/**'
      - 'tests/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-cloudflare:
    # Atualizações relevantes no jogo publicam automaticamente na Cloudflare.
    # Documentação isolada não dispara deploy; as credenciais continuam só em Secrets.
    # Se faltar Secret, o job falha antes de tocar na Cloudflare ou no banco.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar e normalizar credenciais sem expor seus valores
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure os Secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions."
            exit 1
          fi
          ACCOUNT_CLEAN="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if ! [[ "$ACCOUNT_CLEAN" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID inválido. Copie apenas o ID da conta, sem rótulo ou URL."
            exit 1
          fi
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$ACCOUNT_CLEAN" >> "$GITHUB_ENV"
      - name: Identificar e testar o token diretamente na Cloudflare
        run: node scripts/verify-cloudflare-token.mjs
      - name: Instalar dependências no runner
        run: npm install --no-audit --no-fund
      - name: Validar regras e interface antes de publicar
        run: npm test
      - name: Gerar pacote seguro de assets
        run: npm run cf:build
      - name: Criar ou localizar banco D1 exclusivo (sem tocar no Torneio V2)
        run: node scripts/prepare-cloudflare-database.mjs
      - name: Conferir UUID e nome do banco D1 antes das migrações
        run: node scripts/check-cloudflare-database.mjs
      - name: Aplicar somente migrações da base classdamas-db
        run: npx wrangler d1 migrations apply classdamas-db --remote
      - name: Publicar Worker e assets
        run: npx wrangler deploy
      - name: Confirmar API e jogo online após publicar
        run: |
          node --input-type=module <<'JS'
          const base='https://classdamas.jean-silveira35.workers.dev';
          let lastError;
          for(let attempt=1;attempt<=8;attempt++){
            try{
              const p=await fetch(base+'/api?action=ping',{signal:AbortSignal.timeout(7000)});
              const j=await p.json();
              if(!p.ok || j.ok!==true || j.database!=='cloudflare-d1' || j.provider!=='cloudflare'){
                throw Error('API inesperada: HTTP '+p.status+'; resposta segura='+JSON.stringify({ok:j.ok,database:j.database,provider:j.provider}));
              }
              const page=await fetch(base+'/online.html',{signal:AbortSignal.timeout(7000)});
              if(!page.ok || !(await page.text()).includes('<html'))throw Error('Jogo online indisponível: HTTP '+page.status);
              console.log('Verificação pública OK: API D1 + interface ClassDamas em '+base);
              process.exit(0);
            }catch(error){
              lastError=error;
              console.log('Tentativa '+attempt+'/8: '+error.message);
              await new Promise(resolve=>setTimeout(resolve,2500));
            }
          }
          throw lastError;
          JS
      - name: Conferir cadastro, ranking e brasões atualizados no site público
        run: |
          node --input-type=module <<'JS'
          const base='https://classdamas.jean-silveira35.workers.dev';
          for(const action of ['roster','ranking']){
            const res=await fetch(base+'/api?action='+action,{signal:AbortSignal.timeout(15000)});
            const body=await res.json();
            if(!res.ok||body.ok!==true)throw Error(action+' indisponível: HTTP '+res.status);
            if(action==='roster' && body.players?.length!==78)throw Error('Cadastro público incompleto');
            if(action==='ranking' && !Array.isArray(body.houses))throw Error('Ranking por turmas ausente');
            console.log('API '+action+': OK');
          }
          for(const name of ['aguia','leao','dragao']){
            const res=await fetch(base+'/assets/brasao_'+name+'.png?v=20261124',{
              signal:AbortSignal.timeout(20000)
            });
            if(!res.ok)throw Error('Brasão '+name+' indisponível: HTTP '+res.status);
            const data=new Uint8Array(await res.arrayBuffer());
            if(data.length<100000 || data[0]!==137 || data[1]!==80 ||
               data[2]!==78 || data[3]!==71)
              throw Error('Brasão '+name+' inválido ou desatualizado');
            console.log('Brasão oficial '+name+': OK ('+data.length+' bytes)');
          }
          const html=await (await fetch(base+'/online.html',{signal:AbortSignal.timeout(10000)})).text();
          if(html.includes('_hd.png')||!html.includes('brasao_aguia.png?v=20261124'))
            throw Error('HTML público ainda aponta para brasões antigos');
          console.log('API, ranking e brasões: verificação pública concluída.');
          JS
